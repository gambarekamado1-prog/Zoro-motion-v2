name: Build ZoroMotion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: ls -la

      - name: Check project structure
        run: find . -maxdepth 3 -type f | head -200
        
